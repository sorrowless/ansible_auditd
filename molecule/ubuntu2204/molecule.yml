---
dependency:
  name: galaxy
  enabled: false
driver:
  name: docker
platforms:
  - name: instance
    image: auditd-ubuntu2204:local
    pull: false
    pre_build_image: true
    override_command: false
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    capabilities:
      - SYS_ADMIN
      - NET_ADMIN
      - AUDIT_CONTROL
      - AUDIT_WRITE
    security_opts:
      - apparmor=unconfined
      - seccomp=unconfined
provisioner:
  name: ansible
  env:
    ANSIBLE_STRATEGY: linear
  config_options:
    defaults:
      interpreter_python: auto_silent
      stdout_callback: yaml
  inventory:
    host_vars:
      instance:
        ansible_python_interpreter: /usr/bin/python3
  playbooks:
    converge: ../resources/converge.yml
    verify: ../resources/verify.yml
verifier:
  name: ansible
